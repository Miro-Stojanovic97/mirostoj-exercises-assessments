<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Field Agent API Web</title>
        <meta name="description" content="Field Agent API Web">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- CSS only -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->

        <div class="container">
            <h1>Field Agent API Web</h1>
            <div class="row" id="field-agent-cards"></div>

            <button class="btn btn-primary" id="add-agent">Add an Agent</button>

            <form class="mt-5" id="agent-form">
                <h3>Edit Agent</h3>
                <div class="row mb-3">
                    <div class="col">
                        <label for="first-name" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="first-name">
                    </div>
                    <div class="col">
                        <label for="middle-name" class="form-label">Middle Initial:</label>
                        <input type="text" class="form-control" id="middle-name">
                    </div>
                    <div class="col">
                        <label for="last-name" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="last-name">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label for="height" class="form-label">Height ("):</label>
                        <input type="text" class="form-control" id="height">
                    </div>
                    <div class="col">
                        <label for="dob" class="form-label">DOB (YYYY-MM-DD):</label>
                        <input type="text" class="form-control" id="dob">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
        <!-- JavaScript Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
        <script src="./main.js" async defer></script>
    </body>
</html>
