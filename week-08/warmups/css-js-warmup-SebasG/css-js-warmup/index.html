<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>CSS/JS Warmup</title>
    <meta name="description" content="A CSS/JS Warmup Exercise" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSS only -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- CSS States

    State Name      Use Cases
    hover           Anything
    focus           Form fields
    active          <a>Links</a>
    visited         <a>Liks</a>
    ... and more!

    JS Events

    Event Name	Event Attribute   Use Cases
    click	      onclick           Anything
    change	    onchange          Form fields
    keyup	      onkeyup           Anything
    mouseover	  onmouseover       Anything
    ... and more! -->

    <h1>Very sus website</h1>
    <div><button id="button1">Button 1</button></div>

    <div><button id="button2">Button 2</button></div>

    <div><button id="button3">Don't Click Me</button></div>

    <div>
      <span class="material-symbols-outlined"> swap_vertical_circle </span>
      <span class="material-symbols-outlined"> swap_vertical_circle </span>
      <span class="material-symbols-outlined"> swap_vertical_circle </span>
      <span class="material-symbols-outlined"> swap_vertical_circle </span>
      <span class="material-symbols-outlined"> swap_vertical_circle </span>
    </div>

    <div>
      <h2 id="animate">Congratulations, you won a trip somewhere!!!</h2>
    </div>

    <div><p id="box">This is a box... it rotates</p></div>

    <p>Click anywhere to move the ball</p>
    <div id="foo" class="ball"></div>

    <script src="./scripts.js" async defer></script>
  </body>
</html>
